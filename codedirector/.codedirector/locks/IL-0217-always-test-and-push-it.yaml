goal: "W12 (found 11-06 with W7): a Package.swift was hashed whole for no-new-dependency, so a new target, a resource, a platform or a comment read as a new dependency. With W7 every nested Package.swift is guarded, which would make any lock that touches one of them (an Apple project keeps seven) give the promise up. Now a Package.swift counts by its `.package(…)` entries only, the way package.json counts by its dependency maps: a package added, removed, moved to another version or place is a change; order, spacing, line breaks and comments are not. A baseline written before this holds a whole-file hash: the same bytes still hold against it, so an install between a baseline and its verify raises no false change. README says so."
interpretation: "A small scanner in the Apple domain (src/domains/apple/deps.ts), not a Swift parser: comments and whitespace outside string literals go (a URL's // stays), every `.package(` call is read to its closing parenthesis, the entries are sorted and hashed. The Apple domain registers it as Package.swift's fingerprint. The registry gains manifestUnchanged (the fingerprint, or the older whole-file hash, matches); run.ts and verify.ts ask it instead of comparing fingerprints themselves. Package.resolved, Podfile and the lockfiles stay hashed whole."
keep:
  - kind: no-new-dependency
  - kind: custom
    text: "package.json and every other manifest are judged exactly as before (same fingerprints; the added whole-hash match can only hold a manifest whose bytes are identical). No existing assertion is removed or loosened. Measured on eDraft's seven real Package.swift files: the entries found equal the `.package(` calls in each file (1, 4, 2, 3, 0, 0, 3)."
