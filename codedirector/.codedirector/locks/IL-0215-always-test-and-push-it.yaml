goal: "W11 (found 11-06 while reading W1's claim): the claim file `.codedirector/running.json` holds this machine's host name, a pid and the command, and its stale copies in `.codedirector/running-stale/` are kept for good — and git ignores neither in any setup: the managed .codedirector/.gitignore does not list them, a project with the older root block gets no new rule, and a project that commits .codedirector/ (this repository) commits whatever is there. A `git add -A` during a run, or after a crashed one, commits them. Now the claim and the stale claims live in `.codedirector/live/`, a folder that ignores itself (its own .gitignore holds `*`, written once, never rewritten), so git shows nothing whatever the project ignores. A claim an older version left at the old place still refuses a second run while live (and a report still sees it); a stale one, and the old running-stale/ folder, move in on the next claim; a refusal for a claim from another machine names the file where it is."
interpretation: "`runs/` was ruled out by claim.ts's own header (its contents are counted as attempts); changing ensureCodedirectorIgnore would break the rule that an older root block is left as it is (a test asserts no .codedirector/.gitignore is created there). A self-ignoring folder works in every setup without touching any ignore file of the project. Only claim.ts changes; the claim's contents, the liveness rules and every sentence except the path stay as they are."
keep:
  - kind: no-new-dependency
  - kind: custom
    text: "The claim's format, the liveness rules (host, pid, `ps lstart`), the race (hard-link publish), stale claims never deleted, and every refusal and running-now sentence stay as they are; only the path they name changes. No existing assertion is removed or loosened: claim.test.ts and report.test.ts change only the paths they look at, plus the new tests."
deny:
