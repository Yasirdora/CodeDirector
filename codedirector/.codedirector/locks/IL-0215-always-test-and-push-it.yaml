  - "Deliberate breaks, each type-checking (0 errors), each red on exactly one test at the named assertion: the live .gitignore ignores nothing → 'git shows nothing new for a live claim'; the .gitignore rewritten every claim → 'an existing live .gitignore is kept as it is'; an old claim not taken → the live old claim does not refuse; readClaim skips the old place → 'a report sees the older version's run'; the refusal always names the new place → the other-machine refusal; the old stale folder left → 'the old stale folder is moved in'. Restored, claim tests 10/10."
