  - package-lock.json
  - src/core/**
  - src/lock/**
  - src/mcp/**
  - src/verify/**
  - src/report/**
  - src/domain/**
  - src/domains/**
  - eval/**
change: the run claim and stale claims move into a self-ignoring .codedirector/live/ folder; an older version's claim at the old place is still honoured, and stale ones move in
