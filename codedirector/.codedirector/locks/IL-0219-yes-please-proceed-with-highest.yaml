goal: "W13, the owner's yes of 11-06 to items 3 and 4 of the speed plan: a shorter report, live progress, the failed test named, and each check step's time. A verifyCommand that is exactly checks.yaml's run texts joined by ' && ' runs as named checks: the same text in the same one shell, with a silent marker before each check and after the last (an empty file in a temporary folder; `{ true >\"$CDIR_STEP_DIR/<n>\" || true; } 2>/dev/null`, which cannot fail). From the markers: a progress line on the CLI's stderr as each check starts; each check's start, time and outcome in the record (items[].steps) and the run's time (durationMs); a failure or timeout names the check it happened in; exit 0 with a check that never started is Unchecked, naming it. The report names the run by its checks and prints the long command once (the artifact). A check may name `results:` (a path whose last part may hold *): when it fails and its console named no test, the result files it wrote since it started are read by the domain that knows them — the Apple domain reads .xcresult with xcresulttool. Before its Change Report, `cdir run` leaves out the promises, files and violations the report lists. docs/checks.md and the README say so."
interpretation: "New: src/verify/steps.ts (split, marked command, times), src/verify/results.ts (list + read result files), src/domains/apple/results.ts (the .xcresult reader), test/steps.test.ts. Changed: the supervisor sets CDIR_STEP_DIR, reports when the command ended and, when asked, watches the markers and writes progress to its descriptor 3; probe.ts gains runStepsProbe; verify.ts runs named checks, words their items and reads results; the item gains steps, durationMs and resultFiles; checks.yaml gains `results`; the domain API gains ResultReader and the registry resultReader(); format.ts prints a times line; cli-main.ts passes stderr as the progress descriptor to run, verify and report and asks run for the brief summary; run.ts formatRunReport takes { brief }. Windows (cmd.exe) never runs named checks."
