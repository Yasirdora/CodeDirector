goal: "W7 (found 11-05, measured on a real repo): no-new-dependency, the task baseline, the run's KEEP results and the draft's suggested deny looked at dependency manifests at the root only. A project whose manifests sit below the root (an Apple project's apple/Core/Package.swift, a workspace's packages/a/package.json) got 'no-new-dependency: proven' while a new dependency went in. Now every manifest the registered domains name counts wherever it sits in the project: tracked or new, never one git ignores or one inside a build or vendor folder (the core's skip folders and the domains' never-source folders); outside git only the root, as before. A nested package.json keeps the dependency-map fingerprint. A baseline records that it looked at the whole tree; against a baseline taken before this, a manifest below the root is never read as new (no false violation for a lock whose baseline predates an install). The draft suggests denying every manifest. README says so."
interpretation: "One new core module (src/core/manifests.ts: presentManifests, isRootManifest) asks git once (`ls-files --cached --others --exclude-standard` with a `:(glob)**/<name>` pathspec per manifest name, run in the root so a root below the git root sees its own folder by its own paths). The registry stays a lookup: manifestFingerprint also matches by file name. baseline.ts captures every present manifest and writes manifestScope: \"tree\" when it does; appearedManifests there is the one 'appeared' rule run.ts and verify.ts share. draft.ts's manifest deny uses presentManifests (its fs/path imports fall away). The domains' manifest lists do not change."
