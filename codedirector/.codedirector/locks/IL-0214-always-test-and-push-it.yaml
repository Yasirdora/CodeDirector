goal: "W9 and W10 (measured 11-06 on a real repo, IL-0962/IL-0963 in eDraft). W9: `cdir verify` on a lock that a later lock has closed ran nothing, replayed the old run in about a second, and printed \"Blocked … run `cdir undo` to restore\" first, with the closed note last — it read as a fresh failure, and `cdir undo` restores the LATEST checkpoint, the later lock's. W10: `cdir run` on such a lock was accepted and judged against its own task baseline, so files the later lock changed and committed counted as this lock's (a false OUT-OF-BUDGET). Now: an explicit re-check of a closed lock (`cdir verify`, `cdir report --reverify`, the MCP report with reverify) is refused before anything runs, and a new attempt (`cdir run`, also a first attempt when another lock started after this one's task baseline) is refused before the claim, the checkpoint and any record; both name the lock that started and when, and give one remedy (take the changes out, `cdir lock rebase <id> --accept-current`, run; or abandon and carry the contract). A closed lock's summary says it is history first, labels the outcome \"Last recorded:\", and never offers `cdir undo`. README and docs/checks.md say so."
interpretation: closingLock and the two refusal texts move to src/run/closing.ts so run.ts can ask the same question without importing the report module (report.ts re-exports closingLock and ClosingLock for existing callers). runWithLock asks closingLock after the seal check and before ensureCodedirectorIgnore and the claim. buildReport throws a ReportError for reverify on a closed lock when no run, attempt or verification is given. summarizeReport puts the closed sentence first and drops the undo hint for a closed lock.
keep:
  - kind: no-new-dependency
  - kind: custom
    text: A lock that no later lock has closed behaves exactly as before in run, verify, report and the MCP report. `cdir report` without --reverify still shows a closed lock as recorded, re-runs nothing and writes nothing. The lock schema, the seal, the task baseline and `cdir lock rebase --accept-current` are unchanged, and a rebased lock runs again. No existing test assertion is removed or loosened (test/report.test.ts changes only its imports besides the new tests).
